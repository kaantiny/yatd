name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ''
            cross: true
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            suffix: ''
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: '.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/td${{ matrix.suffix }} dist/td-${{ steps.get_version.outputs.version }}-${{ matrix.target }}${{ matrix.suffix }}
          cd dist && tar czf td-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz td-${{ steps.get_version.outputs.version }}-${{ matrix.target }}${{ matrix.suffix }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/td.exe dist/td-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.exe
          cd dist && 7z a td-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.zip td-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/td-*.*
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
